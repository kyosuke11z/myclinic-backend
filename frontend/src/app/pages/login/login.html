<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3H5C3.34 2 2 3.34 2 5v6c0 1.66 1.34 3 3 3h14z"/><path d="M16 14v6c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2v-6"/></svg>
    </div>
    
    <h1 class="login-title">ยินดีต้อนรับกลับ</h1>
    <p class="login-subtitle">ระบบบริหารจัดการคลินิก MyClinic</p>
    
    @if (errorMessage()) {
      <div class="error-alert">
        {{ errorMessage() }}
      </div>
    }
    
    <form class="login-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label class="form-label">ชื่อผู้ใช้งาน</label>
        <div class="input-container">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input 
            type="text" 
            class="login-input" 
            placeholder="กรอกชื่อผู้ใช้" 
            [ngModel]="username()" 
            (ngModelChange)="username.set($event)" 
            name="username" 
            required 
            autocomplete="username"
          />
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <div class="input-container">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input 
            type="password" 
            class="login-input" 
            placeholder="กรอกรหัสผ่าน" 
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)" 
            name="password" 
            required 
            autocomplete="current-password"
          />
        </div>
      </div>
      
      <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>
