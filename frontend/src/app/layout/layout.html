<div class="layout-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3H5C3.34 2 2 3.34 2 5v6c0 1.66 1.34 3 3 3h14z"/><path d="M16 14v6c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2v-6"/></svg>
      <span>MyClinic</span>
    </div>
    
    <ul class="sidebar-menu">
      <li class="sidebar-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a routerLink="/">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="sidebar-item" routerLinkActive="active">
        <a routerLink="/patients">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>ผู้ป่วย (Patients)</span>
        </a>
      </li>
      <li class="sidebar-item" routerLinkActive="active">
        <a routerLink="/appointments">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>นัดหมาย (Appointments)</span>
        </a>
      </li>
    </ul>
    
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>ออกจากระบบ</span>
      </button>
    </div>
  </aside>

  <!-- Main Body -->
  <div class="main-body" style="flex: 1; display: flex; flex-direction: column;">
    <!-- Header -->
    <header class="header">
      <div class="header-title">ระบบบริหารจัดการคลินิก (Clinic Administration)</div>
      
      <div class="header-user">
        <div class="user-avatar">
          {{ username() ? username()![0].toUpperCase() : 'A' }}
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 600; line-height: 1.2;">{{ username() || 'Admin User' }}</span>
          <span style="font-size: 11px; color: var(--text-secondary);">ผู้ดูแลระบบ</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
